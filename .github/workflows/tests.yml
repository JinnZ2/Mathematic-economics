name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calibration:
    name: calibration falsification tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run calibration tests (unittest)
        run: python calibration/test_calibration.py

  physics_guard:
    name: physics_guard tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - name: Run PhysicsGuard tests
        working-directory: physics_guard
        run: pytest tests/ -v

  bridges:
    name: PhysicsGuard <-> Math-Econ bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bridge-test deps
        # numpy is required for AI/equation_bridge.py; without it the
        # organizational-physics bridge tests skip silently.
        run: pip install numpy
      - name: Run bridge tests
        run: python tests/test_bridges.py

  automation_scope_audit:
    name: automation_scope_audit (90 falsifiable claims)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate CLAIM_TABLE.fab.json against claim_contract
        run: python automation_scope_audit/validate_fab.py
      - name: Run audit on both example scenarios
        run: |
          python automation_scope_audit/run.py --no-ledger \
            --allow-missing-scope
      - name: Run scope_gate + cluster harness tests
        run: python tests/test_automation_scope_audit.py

  legacy_ledger:
    name: legacy ledger audit trail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ledger gate falsification tests
        run: python tests/test_legacy_ledger.py
      - name: Validate retirement records resolve to live successors
        # Fails if a ledger entry points at a successor that no longer
        # exists, or at a retained artifact that is missing. Keeps the
        # audit trail from rotting silently as modules move.
        run: python legacy/ledger.py
